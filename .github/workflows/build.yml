name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目不带 wrapper，这里指定一个确定的 Gradle 版本
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # runner 镜像自带完整 Android SDK（/usr/local/lib/android/sdk），
      # 因此不再依赖 android-actions/setup-android —— 该 action 在 license
      # 阶段提前退出时不会写入 PATH，导致后续 sdkmanager 报 127。
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK"
          if [ ! -d "$SDK" ]; then
            echo "找不到 Android SDK: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$TOOLS" ]; then
            echo "找不到 cmdline-tools"
            exit 1
          fi
          echo "cmdline-tools: $TOOLS"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          # 不用 -e：yes 提前关闭管道会让前面的命令返回非零，但 license 实际已接受
          set -uo pipefail
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          # gradle.properties 里的 aapt2FromMavenOverride 指向本机（QEMU 模拟）路径
          # /opt/android-sdk/...，CI 上不存在会导致 "Specified AAPT2 executable does not exist"。
          # 删掉这一行，让 AGP 从 Maven 拉取与 runner 平台匹配的 aapt2。
          sed -i '/^android\.aapt2FromMavenOverride/d' gradle.properties
          gradle assembleDebug --no-daemon -Dorg.gradle.vfs.watch=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agencode-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
